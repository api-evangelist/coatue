aid: coatue
name: Coatue Management
description: >-
  Coatue Management is a global technology-focused investment manager founded in
  1999 by Philippe Laffont, headquartered in New York City with offices in Menlo
  Park, San Francisco, London, and Hong Kong. Originally launched as a
  technology hedge fund, Coatue now invests across public and private markets
  through venture, growth, tactical (structured debt and equity), and public
  equities strategies, emphasizing data-driven research and responsible risk
  management. The firm backs disruptive, high-growth technology companies with a
  strong current thesis around artificial intelligence, software, cloud and data
  infrastructure, fintech, and frontier/space, writing checks that range from
  early-stage venture ($500K–$10M) through large growth and public-market
  allocations. Coatue managed roughly $54–55B in assets as of end of 2024 and
  counts Anthropic, OpenAI, Databricks, Stripe, SpaceX, Figma, and Cursor among
  its private portfolio companies.
